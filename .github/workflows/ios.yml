name: Build for iOS

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-macos-app:
    name: Release IOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-arm64, macos-14, macos-26]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Toolchain info
        run: |
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          swift --version || true
          uname -m

      # Two plugins call iOS 26 / 26.1-only SDK APIs, which breaks builds on
      # Xcode 16 (iOS 18.5 SDK). Neutralise just those calls; app code never
      # reads the affected fields (ConnectivityResult.satellite / isiOSAppOnVision).
      - name: Compat patch for plugin SDK APIs
        run: |
          set -eu
          PC="$HOME/.pub-cache/hosted/pub.dev"
          echo "pub cache: $PC"
          CONN=$(ls -d "$PC"/connectivity_plus-* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${CONN:-}" ]; then
            F="$CONN/ios/connectivity_plus/Sources/connectivity_plus/PathMonitorConnectivityProvider.swift"
            if [ -f "$F" ] && grep -q isUltraConstrained "$F"; then
              sed -i '' 's/path\.isUltraConstrained/false/g' "$F"
              sed -i '' 's/\.isUltraConstrained/false/g' "$F"
              echo "patched connectivity_plus (isUltraConstrained)"
              grep -n isUltraConstrained "$F" || echo "  no references left"
            fi
          fi
          DEV=$(ls -d "$PC"/device_info_plus-* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${DEV:-}" ]; then
            F="$DEV/ios/device_info_plus/Sources/device_info_plus/FPPDeviceInfoPlusPlugin.m"
            if [ -f "$F" ] && grep -q isiOSAppOnVision "$F"; then
              sed -i '' 's/\[info isiOSAppOnVision\]/NO/g' "$F"
              echo "patched device_info_plus (isiOSAppOnVision)"
              grep -n isiOSAppOnVision "$F" || echo "  no references left"
            fi
          fi
          # Runner/SceneDelegate.swift overrides a method returning
          # UIWindowScene.WindowingControlStyle, an iOS 26-only type. On older
          # SDKs fall back to the default delegate (iOS 26 window controls only
          # affect iPad windowing, not iPhone behaviour).
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          if [ "$SDK_MAJOR" -lt 26 ]; then
            printf '%s\n' 'import Flutter' 'import UIKit' '' 'class SceneDelegate: FlutterSceneDelegate {}' > ios/Runner/SceneDelegate.swift
            echo "SDK $SDK_MAJOR < 26: simplified SceneDelegate"
            cat ios/Runner/SceneDelegate.swift
          fi

      - name: Build iOS
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --dart-define-from-file=pili_release.json --no-pub -v > /tmp/build_ios.log 2>&1 || true
          echo "=== tail of flutter build log ==="
          tail -c 200000 /tmp/build_ios.log
          echo "=== build artefacts ==="
          ls -la build/ios/iphoneos/ || true
          du -sh build/ios/iphoneos/Runner.app 2>/dev/null || true

      - name: Package IPA
        if: always()
        run: |
          set -e
          if [ ! -d build/ios/iphoneos/Runner.app ]; then
            echo "::error::Runner.app not produced by the build"
            exit 1
          fi
          ln -sf ./build/ios/iphoneos Payload
          # make AltSign happy...
          find Payload/Runner.app/Frameworks -type d -name "*.framework" -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \; || true
          zip -r9 PiliPlus_ios_${{env.version}}.ipa Payload/Runner.app
          ls -la PiliPlus_ios_*.ipa

      - name: Upload ios release
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: iOS-release-${{ matrix.os }}
          path: PiliPlus_ios_*.ipa
