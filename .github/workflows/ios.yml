name: Build for iOS

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-macos-app:
    name: Release IOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-14]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 iOS

      - name: Toolchain info
        run: |
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          flutter --version || true
          uname -m

      # Two plugins call iOS 26 / 26.1-only SDK APIs, which breaks builds on
      # Xcode 16 (iOS 18.5 SDK). Neutralise just those calls; app code never
      # reads the affected fields (ConnectivityResult.satellite / isiOSAppOnVision).
      - name: Compat patch for plugin SDK APIs
        run: |
          set -eu
          PC="$HOME/.pub-cache/hosted/pub.dev"
          echo "pub cache: $PC"
          CONN=$(ls -d "$PC"/connectivity_plus-* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${CONN:-}" ]; then
            F="$CONN/ios/connectivity_plus/Sources/connectivity_plus/PathMonitorConnectivityProvider.swift"
            if [ -f "$F" ] && grep -q isUltraConstrained "$F"; then
              sed -i '' 's/path\.isUltraConstrained/false/g' "$F"
              sed -i '' 's/\.isUltraConstrained/false/g' "$F"
              echo "patched connectivity_plus (isUltraConstrained)"
            fi
          fi
          DEV=$(ls -d "$PC"/device_info_plus-* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "${DEV:-}" ]; then
            F="$DEV/ios/device_info_plus/Sources/device_info_plus/FPPDeviceInfoPlusPlugin.m"
            if [ -f "$F" ] && grep -q isiOSAppOnVision "$F"; then
              sed -i '' 's/\[info isiOSAppOnVision\]/NO/g' "$F"
              echo "patched device_info_plus (isiOSAppOnVision)"
            fi
          fi
          # Runner/SceneDelegate.swift overrides a method returning
          # UIWindowScene.WindowingControlStyle, an iOS 26-only type.
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          if [ "$SDK_MAJOR" -lt 26 ]; then
            printf '%s\n' 'import Flutter' 'import UIKit' '' 'class SceneDelegate: FlutterSceneDelegate {}' > ios/Runner/SceneDelegate.swift
            echo "SDK $SDK_MAJOR < 26: simplified SceneDelegate"
          fi

      - name: Build A - with performance overlay
        run: |
          set -u
          V=${version//+/_}
          flutter build ios --release --no-codesign \
            --dart-define-from-file=pili_release.json \
            --dart-define=PERF_OVERLAY=true --no-pub -v > /tmp/build_perf.log 2>&1 || true
          echo "=== tail of build log (perf) ==="
          tail -c 120000 /tmp/build_perf.log
          if [ ! -d build/ios/iphoneos/Runner.app ]; then
            echo "::error::Runner.app missing (perf build)"
            exit 1
          fi
          ln -sfn ./build/ios/iphoneos Payload
          find Payload/Runner.app/Frameworks -type d -name "*.framework" \
            -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \; || true
          zip -r9q "PiliPlus_ios_${V}_perf-overlay.ipa" Payload/Runner.app
          ls -la PiliPlus_ios_*.ipa

      - name: Build B - Impeller disabled (Skia fallback)
        run: |
          set -u
          V=${version//+/_}
          /usr/libexec/PlistBuddy -c "Set :FLTEnableImpeller false" ios/Runner/Info.plist 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :FLTEnableImpeller bool false" ios/Runner/Info.plist
          echo "FLTEnableImpeller = $(/usr/libexec/PlistBuddy -c 'Print :FLTEnableImpeller' ios/Runner/Info.plist)"
          rm -rf build/ios
          flutter build ios --release --no-codesign \
            --dart-define-from-file=pili_release.json --no-pub -v > /tmp/build_noimp.log 2>&1 || true
          echo "=== tail of build log (no impeller) ==="
          tail -c 60000 /tmp/build_noimp.log
          if [ ! -d build/ios/iphoneos/Runner.app ]; then
            echo "::error::Runner.app missing (no-impeller build)"
            exit 1
          fi
          rm -f Payload
          ln -sfn ./build/ios/iphoneos Payload
          find Payload/Runner.app/Frameworks -type d -name "*.framework" \
            -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \; || true
          zip -r9q "PiliPlus_ios_${V}_no-impeller.ipa" Payload/Runner.app
          ls -la PiliPlus_ios_*.ipa

      - name: Upload ios release
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: iOS-release-${{ matrix.os }}
          path: PiliPlus_ios_*.ipa
